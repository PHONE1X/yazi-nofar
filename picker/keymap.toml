# Клавиши Yazi в роли файлпикера — добавки поверх штатных клавиш yazi.
# Основной ~/.config/yazi/keymap.toml сюда не попадает, и наоборот.
#
#   Enter / l / →   папка — войти; файл — выбрать
#                   (при сохранении — заменить этот файл, с вопросом)
#   s / Ctrl+S      сохранить сюда (спросит имя) / выбрать папку, в которой стоишь
#   q               отмена
#   Пробел          отметить файл (когда можно выбрать несколько)

[mgr]
prepend_keymap = [
	{ on = "<Enter>", run = "plugin picker enter", desc = "Папка: войти · файл: выбрать" },
	{ on = "l",       run = "plugin picker enter", desc = "Папка: войти · файл: выбрать" },
	{ on = "<Right>", run = "plugin picker enter", desc = "Папка: войти · файл: выбрать" },
	{ on = "s",       run = "plugin picker here",  desc = "Сохранить сюда / выбрать эту папку" },
	{ on = "<C-s>",   run = "plugin picker here",  desc = "Сохранить сюда / выбрать эту папку" },
	{ on = "q",       run = "quit --no-cwd-file",  desc = "Отмена" },

	# то же, что в основном yazi: закладки, телефон, диски, превью, прыжки на N строк
	{ on = "'",          run = "plugin far-bookmarks jump",      desc = "Прыжок по закладке" },
	{ on = "`",          run = "plugin far-bookmarks",           desc = "Закладки" },
	{ on = [ "g", "p" ], run = "plugin kdeconnect browse",       desc = "Телефон (KDE Connect)" },
	{ on = "M",          run = "plugin mount",                   desc = "Диски и флешки" },
	{ on = "T",          run = "plugin toggle-pane min-preview", desc = "Показать / скрыть превью" },
	{ on = "1", run = "plugin relative-motions 1", desc = "Move in relative steps" },
	{ on = "2", run = "plugin relative-motions 2", desc = "Move in relative steps" },
	{ on = "3", run = "plugin relative-motions 3", desc = "Move in relative steps" },
	{ on = "4", run = "plugin relative-motions 4", desc = "Move in relative steps" },
	{ on = "5", run = "plugin relative-motions 5", desc = "Move in relative steps" },
	{ on = "6", run = "plugin relative-motions 6", desc = "Move in relative steps" },
	{ on = "7", run = "plugin relative-motions 7", desc = "Move in relative steps" },
	{ on = "8", run = "plugin relative-motions 8", desc = "Move in relative steps" },
	{ on = "9", run = "plugin relative-motions 9", desc = "Move in relative steps" },
]
