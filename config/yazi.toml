# Yazi — файловый менеджер и (тем же конфигом) системный файлпикер: режим
# пикера включает обёртка портала, см. plugins/picker.yazi.
#
# Enter/l открывают файлы через плагин doc-open (список «чем что открывать»
# правится попапом F). Правила ниже работают для o / O («Открыть с помощью…»).
# В yazi 26 путь подставляется как %s (все выбранные) или %s1 (первый).
# Старое "$@" больше не работает: программа получала пустой список и
# открывалась без файла.

[mgr]
show_hidden = true
ratio = [1, 4, 3]
sort_by = "natural"
sort_dir_first = true
sort_reverse = true
linemode = "size"

# архивы в превью — список содержимого (ouch)
[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run  = "ouch"

# markdown в превью — свёрстанный текст (glow), а не исходник
[[plugin.prepend_previewers]]
url = "*.{md,markdown}"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

# git status (значки git у файлов в списке)
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

[opener]
edit = [
	{ run = "nvim %s", block = true, desc = "nvim", for = "unix" },
]
view = [
	{ run = "gwenview %s", orphan = true, desc = "Gwenview", for = "unix" },
]
play = [
	{ run = "haruna %s", orphan = true, desc = "Haruna", for = "unix" },
	{ run = "mpv %s", orphan = true, desc = "mpv", for = "unix" },
]
listen = [
	{ run = "mpv --player-operation-mode=pseudo-gui %s", orphan = true, desc = "mpv", for = "unix" },
]
okular = [
	{ run = "okular %s", orphan = true, desc = "Okular", for = "unix" },
]
librewriter = [
	{ run = "libreoffice --writer %s", orphan = true, desc = "LibreOffice Writer", for = "unix" },
]
librecalc = [
	{ run = "libreoffice --calc %s", orphan = true, desc = "LibreOffice Calc", for = "unix" },
]
libreimpress = [
	{ run = "libreoffice --impress %s", orphan = true, desc = "LibreOffice Impress", for = "unix" },
]
libredraw = [
	{ run = "libreoffice --draw %s", orphan = true, desc = "LibreOffice Draw", for = "unix" },
]
portproton = [
	{ run = "portproton %s1", orphan = true, desc = "PortProton", for = "unix" },
]
extract = [
	{ run = "ouch decompress %s", desc = "Распаковать сюда (ouch)", for = "unix" },
]
extract_7z = [
	{ run = "7z x %s1", desc = "Распаковать сюда (7z)", for = "unix" },
]
open = [
	{ run = "xdg-open %s1", desc = "Системная программа (xdg-open)", for = "unix" },
]

[open]
prepend_rules = [
	# 1. Windows-программы по расширению (до MIME: у .exe он бывает обманчивым)
	{ url = "*.{exe,EXE,msi,MSI,bat,lnk}", use = [ "portproton", "extract" ] },
	{ mime = "application/microsoft.portable-executable", use = "portproton" },
	{ mime = "application/x-ms-dos-executable", use = "portproton" },
	{ mime = "application/x-msi", use = "portproton" },
	{ mime = "application/x-wine-extension-exe", use = "portproton" },

	# 2. Медиа
	{ mime = "image/*", use = [ "view", "open" ] },
	{ mime = "video/*", use = [ "play", "open" ] },
	{ mime = "audio/*", use = [ "listen", "open" ] },

	# 3. Архивы
	{ mime = "application/{zip,tar,bzip2,7z*,rar,xz,zstd,java-archive,gzip}", use = [ "extract", "extract_7z", "open" ] },

	# 4. Документы
	{ mime = "application/pdf", use = [ "okular", "open" ] },
	{ url = "*.{doc,docx,odt,rtf}", use = [ "librewriter", "open" ] },
	{ url = "*.{xls,xlsx,ods,csv}", use = [ "librecalc", "edit", "open" ] },
	{ url = "*.{ppt,pptx,odp}", use = [ "libreimpress", "open" ] },
	{ url = "*.{odg,vsd,vsdx}", use = [ "libredraw", "open" ] },

	# 5. Текст и пустые файлы
	{ mime = "text/*", use = [ "edit", "open" ] },
	{ mime = "application/{json,javascript,x-shellscript,xml,toml,x-yaml}", use = [ "edit", "open" ] },
	{ mime = "inode/empty", use = [ "edit", "open" ] },
]

append_rules = [
	# 6. Всё остальное — системные ассоциации
	{ url = "*", use = [ "open", "edit" ] },
]
